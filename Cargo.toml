[workspace]
resolver = "2"
members = [
    "crates/let-timer-core",
    "crates/let-timer-cli",
    "crates/let-timer-daemon",
    "crates/let-timer-http",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `test-util` is for `tokio::time::pause`, so the tick tests do not have to
# wait out real seconds and cannot flake on a busy machine.
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9", features = ["fuzzy", "date"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
color-eyre = "0.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
utoipa = { version = "6.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
toml = "0.8"
let-timer-core = { path = "crates/let-timer-core" }
