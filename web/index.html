<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <title>Let-timer</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('motion') === 'off') {
            document.documentElement.setAttribute('data-motion', 'off');
            return;
          }
          var m = localStorage.getItem('let_timer_motion');
          if (m && m !== 'system') {
            document.documentElement.setAttribute('data-motion', m);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] antialiased min-h-screen selection:bg-[var(--accent)] selection:text-[var(--on-accent)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
