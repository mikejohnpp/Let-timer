# Configuration for cargo-deny (SEC-9)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSL-1.0",
    "Zlib",
    "GPL-3.0-or-later",
    "GPL-3.0",
    "OpenSSL",
    # webpki-roots (CA certificate bundle pulled in by reqwest/rustls):
    # OSI-approved permissive data license, no copyleft obligations.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
