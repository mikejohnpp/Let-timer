[workspace]
resolver = "2"
members = [
    "crates/let-timer-core",
    "crates/let-timer-cli",
    "crates/let-timer-daemon",
    "crates/let-timer-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9", features = ["fuzzy", "date"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
# `event-stream` is required for `EventStream`; ratatui-crossterm pulls in
# crossterm without any feature, so the feature has to be enabled here.
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
# `StreamExt::next` for reading crossterm events.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Keymap config file parsing.
toml = "1"
let-timer-core = { path = "crates/let-timer-core" }
