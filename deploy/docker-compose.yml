services:
  let-timer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/let-timer/let-timer:latest
    restart: unless-stopped
    environment:
      - LET_TIMER_DB=/data/let-timer.db
      - LET_TIMER_HTTP=0.0.0.0:8765
      - LET_TIMER_BOOTSTRAP_TOKEN=${LET_TIMER_BOOTSTRAP_TOKEN:-}
      - LET_TIMER_NOTIFY=${LET_TIMER_NOTIFY:-log}
      - LET_TIMER_NTFY_URL=${LET_TIMER_NTFY_URL:-}
      - LET_TIMER_TIMEZONE=${LET_TIMER_TIMEZONE:-UTC}
      - RUST_LOG=info
    volumes:
      - lt-data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - let-timer

  # Optional continuous SQLite replication to S3 / Cloudflare R2
  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    profiles:
      - backup
    volumes:
      - lt-data:/data:ro
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    command: replicate
    depends_on:
      - let-timer

volumes:
  lt-data:
  caddy_data:
  caddy_config:
