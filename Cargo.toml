[workspace]
resolver = "2"
members = [
    "crates/let-timer-core",
    "crates/let-timer-cli",
    "crates/let-timer-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal"] }

# Embedded database
rusqlite = { version = "0.40", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
let-timer-core = { path = "crates/let-timer-core" }