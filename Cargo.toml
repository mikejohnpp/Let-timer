[workspace]
resolver = "2"
members = [
    "crates/let-timer-core",
    "crates/let-timer-cli",
    "crates/let-timer-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `test-util` is for `tokio::time::pause`, so the tick tests do not have to
# wait out real seconds and cannot flake on a busy machine.
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9", features = ["fuzzy", "date"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
color-eyre = "0.6.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
let-timer-core = { path = "crates/let-timer-core" }
